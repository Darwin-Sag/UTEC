<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Formulario de Matrícula</title>
<link rel="stylesheet" href="style.css">
<link rel="shortcut icon" href="IMAGEN/icon.png" type="image/x-icon">
</head>
<body>
<header class="cabecera">
    <img src="IMAGEN/logo_utec.png" alt="Universidad Tecnologica y Ingenería" class="nombre">
</header>
<main>
<form>

<fieldset>
    <legend>Datos Personales</legend>
    <div class="campo">
        <label for="nombre">Nombres:</label>
        <input type="text" id="nombre" name="nombre" placeholder="Ingresar su nombres" title="Ingresar Nombre" required>
    </div>
    <div class="campo">
        <label for="apellido">Apellidos:</label>
        <input type="text" id="apellido" name="apellido" placeholder="Ingresar su apellido" title="Ingresar Apellido" required>
    </div>
    <div class="campo">
        <label for="edad">Edad:</label>
        <input type="number" oninput="Validar_edad()" id="edad" name="edad" min="16" placeholder="Ingresar su edad" title="Ingresar Edad" required>
        <script>
            function Validar_edad() {
                let Edad = document.getElementById("edad").value
                if (Edad[2] < 16) {
                    document.getElementById('edad').value="";
                    alert('La edad minima es de 16')
                }
            }
        </script>
    </div>
    <div class="campo">
        <label for="dni">DNI:</label>
        <input type="text" minlength="8" maxlength="8" oninput="Validar_dni()" pattern="0[0-9]{7}" id="dni" name="dni" placeholder="Ingresar su N° DNI" title="Ingresar DNI" required>
        <script>
            function Validar_dni(){
                let Dni= document.getElementById('dni').value
            if (Dni[0] != 0) {
                document.getElementById('dni').value="";
                alert('El dni debe de comenzar con el digito 0')
            }
            }
        </script>
    </div>
    <div class="campo">
        <label for="correo">Correo electrónico:</label>
        <input type="email" id="correo" name="correo" placeholder="Ingresar su correo" title="Ingresar Correo" onblur="validarCorreo()">
    <script>
        function validarCorreo() {
            const correo = document.getElementById("correo");

            if (correo.value !== "" && !correo.value.includes("@")) {
            alert("Debes incluir el símbolo @ en el correo electrónico.");
            correo.value = "";
            }
        }
    </script>
    </div>
    <div class="campo">
        <label for="telefono">Teléfono:</label>
        <input type="text" maxlength="9" oninput="Validar_celular()" pattern="9[0-9]{8}" inputmode="numeric" id="telefono" name="telefono" placeholder="Ingresar su numero de telefono" title="Ingresar telefono">
        <script>
            function Validar_celular() {
                let Tel=document.getElementById("telefono").value;
                if (Tel.length > 0 && Tel[0] != 9){
                    document.getElementById("telefono").value ="";
                    alert('El numero debe iniciar con el digito 9')
                }
                
            }
        </script>
    </div>
</fieldset>

<fieldset>
    <legend>Datos del Apoderado</legend>
    <div class="campo">
        <label for="nombre">Nombre Completo:</label>
        <input type="text" id="nombre" name="nombre" placeholder="Ingresar su nombre completo" title="Ingresar Nombre" required>
    </div>

    <div class="campo">
        <label for="telefonop">Teléfono:</label>
        <input type="text" maxlength="9" oninput="Validar_celularp()" pattern="9[0-9]{8}" inputmode="numeric" id="telefonop" name="telefono" placeholder="Ingresar su numero de telefono" title="Ingresar telefono">
        <script>
            function Validar_celularp() {
                let telefono_p=document.getElementById("telefonop").value;
                if (telefono_p.length > 0 && telefono_p[0] != 9){
                    document.getElementById("telefonop").value ="";
                    alert('El numero debe iniciar con el digito 9')
                }
                
            }
        </script>
    </div>
</fieldset>

<fieldset>
    <legend>Carrera</legend>
    <div class="campo">
        <label for="carrera">Carrera:</label>
        <select id="carrera" name="carrera">
        <option value="">-- Seleccione --</option>
        <option>Ingeniería de Sistemas</option>
        <option>Ingenería de Software</option>
        <option>Ciencia de Datos e IA</option>
        <option>Ingenería en Ciberseguridad</option>
        <option>Ingenería Mecatronica</option>
        <option>Ingenería Informatica</option>
        <option>Ingeneria de Mecanica</option>
        <option>Ingenería Electronica</option>
        </select>
    </div>
</fieldset>

<fieldset>
    <legend>Cursos a Matricular</legend>

    <div class="check">
        <input type="checkbox" class="curso" onclick="contar_cursos()">
        <label for="curso1">Programación</label>
    </div>
    <div class="check">
        <input type="checkbox" class="curso" onclick="contar_cursos()">
        <label for="curso2">Matemática</label>
    </div>
    <div class="check">
        <input type="checkbox" class="curso" onclick="contar_cursos()">
        <label for="curso3">Base de Datos</label>
    </div>
    <div class="check">
        <input type="checkbox" class="curso" onclick="contar_cursos()">
        <label for="curso4">Inglés</label>
    </div>
    <div class="check">
        <input type="checkbox" class="curso" onclick="contar_cursos()">
        <label for="curso5">Comunicación</label>
    </div>

    <div class="campo">
        <label for="numCursos">Número de cursos:</label>
        <input type="text" id="numCursos">
    </div>
    <div class="campo">
        <label for="costoTotal">Costo total:</label>
        <input type="text" id="costoTotal">
        <script>
            function contar_cursos() {
                let num_cursos = document.querySelectorAll(".curso:checked");
                document.getElementById('numCursos').value= num_cursos.length;
                document.getElementById('costoTotal').value = "S/ " + num_cursos.length * 150;
            }
        </script>
    </div>
</fieldset>

<div class="botones">
    <button type="submit">Matricular</button>
    <button type="reset">Limpiar</button>
    <button type="button" onclick="mostrar()">Mostrar Datos</button>
    <button type="button" onclick="pdf()">PDF</button>
    <script>
        function mostrar() {
            let nombre = document.getElementById('nombre').value;
            let apellido = document.getElementById('apellido').value;
            let edad = document.getElementById('edad').value;
            let documento = document.getElementById('dni').value;
            let correo_el = document.getElementById('correo').value;
            let tel = document.getElementById('telefono').value;

            alert('Nombre: ' + nombre 
            + '\n Apellido: ' + apellido 
            + '\n Edad: ' + edad
            + '\n Dni: ' + documento
            + '\n Correo: ' + correo_el
            + '\n Telefono: ' + tel
        )
        }

        function pdf(){
            window.print();
        }
    </script>
</div>
</form>
</main>
</body>
</html>
